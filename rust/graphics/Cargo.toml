[package]
name = "site-graphics"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wgpu = { version = "=24.0.5", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "=0.4.55"
web-sys = { version = "=0.3.82", features = ["HtmlCanvasElement"] }
bytemuck = { version = "1.24", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
